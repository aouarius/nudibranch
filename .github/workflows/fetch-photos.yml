name: Fetch species photos

# Runs the photo fetcher on GitHub's runners (they can reach iNaturalist) and
# commits the candidate photos to the fetch-species-photos branch for review.
on:
  workflow_dispatch:
  push:
    branches: [fetch-species-photos]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A list of new species to look up wins over the species already in the app.
      - run: |
          list=app/src/main/assets/species.json
          if [ -f tools/new_species_candidates.json ]; then list=tools/new_species_candidates.json; fi
          python3 tools/fetch_species_photos.py "$list" photo-candidates 2
      - name: Commit candidates for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-candidates
          git commit -m "Photo candidates from iNaturalist"
          git push origin HEAD:fetch-species-photos
