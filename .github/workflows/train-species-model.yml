name: Train species model

# Fetches freely licensed iNaturalist photos for every species in the app, trains the
# recognition model on GitHub's runners and commits the result to the
# train-species-model branch (model, labels and a report with the accuracy).
on:
  workflow_dispatch:
  push:
    branches: [train-species-model]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tensorflow-cpu==2.20.0 pillow
      - name: Reuse photos from earlier runs
        uses: actions/cache@v4
        with:
          path: training-photos
          key: training-photos-${{ hashFiles('app/src/main/assets/species.json', 'tools/model/fetch_training_photos.py') }}
          restore-keys: training-photos-
      - run: python3 tools/model/fetch_training_photos.py app/src/main/assets/species.json training-photos 300
      - run: python3 tools/model/train.py training-photos model-output
      - name: Commit model for review
        run: |
          rm -rf model-output/saved_model
          cp training-photos/counts.json model-output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-output
          git commit -m "Species model from run ${{ github.run_id }}"
          git push origin HEAD:train-species-model
